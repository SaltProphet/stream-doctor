[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-doctor"
version = "0.1.0"
description = "Local Windows OBS diagnostics and monitoring"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "websockets>=12",
  "psutil>=5.9",
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
stream-doctor = "stream_doctor.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["stream_doctor*"]
